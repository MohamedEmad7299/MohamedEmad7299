<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07060e"/>
      <stop offset="50%" stop-color="#0c0a1a"/>
      <stop offset="100%" stop-color="#120c24"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2a2548" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 3px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      fill: #cbd5e1;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .chip-metric {
      font-weight: 800;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="280" rx="16" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="900" height="280" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="60" r="110" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="800" cy="200" r="130" fill="#a855f7" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="480" cy="140" r="90" fill="#6366f1" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Decorative Border -->
  <rect x="2" y="2" width="896" height="276" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Status / Role Badge Pill -->
  <g transform="translate(50, 42)">
    <rect width="280" height="26" rx="13" fill="#1e1838" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="14" cy="13" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" class="badge-text">SENIOR MOBILE ENGINEER</text>
  </g>

  <!-- Location & Company Indicator (Top Right) -->
  <g transform="translate(620, 44)">
    <text x="230" y="15" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      ULTIMATE SOLUTIONS • GIZA, EGYPT
    </text>
  </g>

  <!-- Main Name Title -->
  <text x="50" y="125" class="name-title" fill="url(#accentGradient)">MOHAMED EMAD</text>

  <!-- Subtitle / Mission Statement -->
  <text x="50" y="160" class="subtitle">
    Android &amp; Flutter Developer <tspan fill="#64748b">•</tspan> Onyx ERP Systems <tspan fill="#64748b">•</tspan> 1,000+ Codeforces Solutions
  </text>

  <!-- Bottom Interactive Chips / Metrics Bar -->
  <g transform="translate(50, 196)">
    
    <!-- Chip 1: Crash Reduction -->
    <g transform="translate(0, 0)">
      <rect width="145" height="38" rx="8" fill="#141126" stroke="#2e2752" stroke-width="1"/>
      <text x="14" y="24" class="chip-text"><tspan class="chip-metric">-45%</tspan> Crashes</text>
    </g>

    <!-- Chip 2: Speed -->
    <g transform="translate(155, 0)">
      <rect width="145" height="38" rx="8" fill="#141126" stroke="#2e2752" stroke-width="1"/>
      <text x="14" y="24" class="chip-text"><tspan class="chip-metric">+30%</tspan> Faster UI</text>
    </g>

    <!-- Chip 3: ERP Uptime -->
    <g transform="translate(310, 0)">
      <rect width="155" height="38" rx="8" fill="#141126" stroke="#2e2752" stroke-width="1"/>
      <text x="14" y="24" class="chip-text"><tspan class="chip-metric">99.5%</tspan> ERP Uptime</text>
    </g>

    <!-- Chip 4: Field Agents -->
    <g transform="translate(475, 0)">
      <rect width="155" height="38" rx="8" fill="#141126" stroke="#2e2752" stroke-width="1"/>
      <text x="14" y="24" class="chip-text"><tspan class="chip-metric">200+</tspan> Field Agents</text>
    </g>

    <!-- Chip 5: Codeforces -->
    <g transform="translate(640, 0)">
      <rect width="160" height="38" rx="8" fill="#141126" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6"/>
      <text x="14" y="24" class="chip-text"><tspan class="chip-metric">1,000+</tspan> Codeforces</text>
    </g>

  </g>

  <!-- Top Accent Highlight Line -->
  <line x1="50" y1="2" x2="250" y2="2" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
</svg>
